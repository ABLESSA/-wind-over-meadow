<script>(() => {
'use strict';

function noise2(x,y,seed){const ix=Math.floor(x),iy=Math.floor(y);let fx=fract(x),fy=fract(y);fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=hash(ix*73+iy*151+seed),b=hash((ix+1)*73+iy*151+seed),c=hash(ix*73+(iy+1)*151+seed),d=hash((ix+1)*73+(iy+1)*151+seed);return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;}

const branch=x=>735+38*Math.sin(x*.006);

const periodicDistance=(a,b)=>Math.abs(((a-b+MAP_H*.5)%MAP_H+MAP_H)%MAP_H-MAP_H*.5);

 let x=river(y)+side*(riverWidth(y)+setback);for(let k=0;k<5;k++){if([-1,1].every(q=>[-.8,0].every(v=>coastField(x+q*size*.53,y+v*size)>12)))break;x+=side*8;}

const waterfrontLandings=[{side:-1,y:140},{side:-1,y:321},{side:1,y:687},{side:1,y:865}];
const landforms=[{type:'ridge',x:151,y:610,size:225,height:126,seed:2001},{type:'ridge',x:888,y:386,size:204,height:138,seed:2002},{type:'ridge',x:164,y:1145,size:178,height:112,seed:2003}];
const pedestrians=[];
for(let bridge=0;bridge<bridgeSites.length;bridge++)for(let j=0;j<2;j++)pedestrians.push({type:'person',route:'bridge',bridge,seed:bridge*31+j*8+3,phase:bridge*.19+j*.43,height:14+j,umbrella:bridge===0&&j===1});

const bambooGroves=[{x:880,y:130},{x:830,y:220},{x:100,y:340},{x:80,y:810},{x:860,y:1100},{x:920,y:950}];

let t=0,flightDistance=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,last=0,dirty=true;
const flight={x:485,y:654,heading:0,yawRate:0,bank:0,vx:0,vy:-28,airspeed:28,routePhase:0,dive:0,pitch:0,altitude:1};
const camera={y:0},chunks=new Map();
const perf={frames:0,elapsed:0,drawMs:0,maxDrawMs:0};

// Pixel terrain is generated in world coordinates, so texture does not swim as the camera advances.
const terrainGenerator=document.createElement('canvas');
const gl=terrainGenerator.getContext('webgl',{alpha:false,antialias:false,powerPreference:'high-performance'});
if(!gl){$('loading').textContent='请使用支持 WebGL 的桌面浏览器打开。';return;}
const vs=`attribute vec2 a;varying vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
const fs=`precision highp float;
varying vec2 uv;uniform float cameraY;uniform float clock;
const float PI=3.14159265359;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+1.),f.x),f.y);}
float fb(vec2 p){return noise(p)*.59+noise(p*2.03)*.25+noise(p*4.11)*.12+noise(p*8.03)*.04;}
float river(float y){return 505.+100.*sin(y*PI*2./1200.)+29.*sin(y*PI*4./1200.+.5);}
float width(float y){return 83.+13.*sin(y*PI*4./1200.-.4)+8.*sin(y*PI*6./1200.);}
float branch(float x){return 735.+38.*sin(x*.006);}
float pd(float a,float b){return abs(mod(a-b+600.,1200.)-600.);}
float canal(vec2 p){return min(abs(p.x-river(p.y))-width(p.y),max(pd(p.y,branch(p.x))-21.,p.x-river(p.y)));}
float hill(vec2 p){vec2 a=vec2((p.x-135.)/175.,pd(p.y,555.)/205.),b=vec2((p.x-930.)/182.,pd(p.y,350.)/235.),c=vec2((p.x-170.)/175.,pd(p.y,1080.)/175.);return 104.*exp(-dot(a,a))+125.*exp(-dot(b,b))+78.*exp(-dot(c,c));}
vec3 shade(vec2 world){
 vec2 p=world,q=vec2(p.x,mod(p.y,1200.));float n=fb(p*.017),grain=hash(floor(p)),d=canal(q)+(noise(p*.045)-.5)*2.8;
 float depth=smoothstep(0.,72.,-d);vec3 water=mix(vec3(.46,.54,.53),vec3(.16,.25,.27),depth);water+=(n-.5)*vec3(.035,.043,.044);
 float reflection=exp(-pow((q.x-river(q.y)+18.)/34.,2.));water=mix(water,vec3(.64,.69,.65),reflection*.19);
 float height=hill(q),dx=(hill(q+vec2(3.,0.))-hill(q-vec2(3.,0.)))/6.,dy=(hill(q+vec2(0.,3.))-hill(q-vec2(0.,3.)))/6.;
 vec3 normal=normalize(vec3(-dx,-dy,1.));float light=dot(normal,normalize(vec3(-.55,-.55,.8)));
 vec3 land=mix(vec3(.38,.41,.36),vec3(.67,.68,.58),n);land*=.59+light*.57;
 float mountain=smoothstep(15.,85.,height);land=mix(land,vec3(.24,.29,.28)*(.66+light*.46),mountain*.64);
 float rock=smoothstep(.35,.65,abs(dx)+abs(dy))*step(.52,fb(p*.036));land=mix(land,vec3(.57,.59,.54)*(.60+light*.54),rock*.55);
 // A small irregular clearing replaces the repeated rectangular crop grids.
 vec2 field=(q-vec2(130.,175.))/vec2(96.,66.);float fieldShape=length(field)+(fb(p*.03)-.5)*.24;float fieldMask=1.-smoothstep(.78,1.,fieldShape);
 vec3 crop=mix(vec3(.57,.59,.43),vec3(.67,.68,.52),n);land=mix(land,crop,fieldMask*.72);
 float path=(1.-smoothstep(8.,25.,d))*.40;land=mix(land,vec3(.66,.67,.59),path);
 land+=(grain-.5)*.018;vec3 color=mix(water,land,smoothstep(-1.,1.8,d));

}
void main(){float y=mod((1.-uv.y)*1000.+cameraY,1200.),blend=smoothstep(0.,1.,y/1200.);gl_FragColor=vec4(mix(shade(vec2(uv.x*1000.,y)),shade(vec2(uv.x*1000.,y-1200.)),blend),1.);}
`;
function compile(type,code){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}

const cameraLoc=gl.getUniformLocation(program,'cameraY'),clockLoc=gl.getUniformLocation(program,'clock');

function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function polygon(g,points,color){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(Math.round(x),Math.round(y)):g.moveTo(Math.round(x),Math.round(y)));g.closePath();g.fill();}

 for(let y=Math.max(0,centerY-radius-28);y<Math.min(176,centerY+radius+25);y+=2)for(let x=8;x<138;x+=2){

 }

}
function pine(seed){

 polygon(g,[[70,171],[72,75],[74,75],[74,168],[79,173],[72,170],[67,174]],'#aa8a51');
 for(let tier=4;tier>=0;tier--){const top=12+tier*23,bottom=top+48,rad=15+tier*7;
  const points=[[72,top]];for(let j=1;j<=6;j++){const yy=top+j*7,ww=rad*j/6;points.push([72-ww+(j%2?2:-2),yy],[72-ww+5,yy+1]);}
  points.push([72,bottom+6]);for(let j=6;j>=1;j--){const yy=top+j*7,ww=rad*j/6;points.push([72+ww+(j%2?2:-2),yy],[72+ww-5,yy-1]);}

  polygon(g,[[72,top],[72-rad+4,bottom-5],[70,bottom+1],[75,top+13]],'#557b48');
  for(let j=0;j<180;j++){const yy=top+8+rnd()*37,half=rad*(yy-top)/48,x=72+(rnd()-.5)*half*2;if(x>73&&rnd()<.55)continue;g.fillStyle=x<72?(rnd()<.2?'#a2ac60':'#77934f'):'#396244';g.fillRect(Math.round(x/2)*2,Math.round(yy/2)*2,2+rnd()*4,2);}

function willow(seed){

 for(let j=0;j<20;j++){const x=33+r()*78,y=75+r()*37,length=22+r()*30,bend=(x-72)*.11;
  g.strokeStyle='#526c55';g.lineWidth=.8;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+bend,y+length*.6,x+bend-3,y+length);g.stroke();
  for(let k=0;k<length;k+=3){g.fillStyle=k%6?'#829378':'#a2ab8c';g.fillRect(Math.round(x+bend*k/length),Math.round(y+k),2,4);}
 }tree.shadow=tinted(tree.c,'#293f37');return tree;

  ctx.strokeStyle='#c0c8b3';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,60,w*.34+2,65,0,Math.PI,TAU);ctx.stroke();
  for(let j=0;j<=18;j++){const a=Math.PI+j/18*Math.PI;ctx.strokeStyle='#788b77';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(Math.cos(a)*(w*.34-1),60+Math.sin(a)*62);ctx.lineTo(Math.cos(a)*(w*.34+5),60+Math.sin(a)*68);ctx.stroke();}
  for(const side of [-1,1]){ctx.fillStyle='#9eae97';ctx.fillRect(side*L-(side<0?0:18),58,18,5);}
 }else{
  // Separate stone piers and lintels create three open spans.
  for(const side of [-1,1]){const px=side*w*.25,top=bridgeDeckY(o,.5)+17;
   polygon(ctx,[[px-6,top],[px+5,top],[px+5,61],[px-6,61]],'#95a18e');polygon(ctx,[[px+5,top],[px+11,top-4],[px+11,56],[px+5,61]],'#546c60');
   ctx.strokeStyle='#687f6b';ctx.lineWidth=.7;for(let yy=top+9;yy<60;yy+=10){ctx.beginPath();ctx.moveTo(px-6,yy);ctx.lineTo(px+5,yy);ctx.stroke();}
   ctx.fillStyle='#b6c0a8';ctx.fillRect(px-10,top-3,23,5);ctx.fillRect(px-9,60,22,4);
   ctx.strokeStyle='rgba(194,209,193,.55)';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(px+1,65,15,3.5,0,.1,Math.PI);ctx.stroke();
   ctx.globalAlpha=.11;ctx.fillStyle='#293f39';ctx.fillRect(px-4,66,9,35);ctx.globalAlpha=1;
  }
  bridgeOutline(o,true);for(let j=40;j>=0;j--){const u=j/40;ctx.lineTo((u-.5)*w*1.1,bridgeDeckY(o,u)+27);}ctx.closePath();ctx.fillStyle='#7b907a';ctx.fill();
 }
 // Stone deck, individual treads, rear rail and front rail are distinct layers.
 bridgeOutline(o,false);for(let j=40;j>=0;j--){const u=j/40;ctx.lineTo((u-.5)*w*1.1,bridgeDeckY(o,u)+16);}ctx.closePath();ctx.fillStyle='#c5cab5';ctx.fill();
 ctx.strokeStyle='#a4af98';ctx.lineWidth=.8;for(let j=0;j<=30;j++){const u=j/30,x=(u-.5)*w*1.1,yy=bridgeDeckY(o,u);ctx.beginPath();ctx.moveTo(x,yy+1);ctx.lineTo(x,yy+15);ctx.stroke();}
 bridgeRail(o,false);bridgeRail(o,true);ctx.restore();
}
function paintBridge(o,y){paintStoneBridge(o,y);}
function drawBridgeFrontRail(o,y){ctx.save();ctx.translate(o.x,y);bridgeRail(o,true);ctx.restore();}

function drawWaterfrontStairs(){
 for(const landing of waterfrontLandings){const {y,side}=landing,x=river(y)+side*riverWidth(y),extent=14;
  for(let j=0;j<7;j++){const a=j/7,b=(j+1)/7,xa=x-side*(a*28-2),xb=x-side*(b*28-2),ya=y+a*24,yb=y+b*24;
   polygon(ctx,[[xa,ya-extent],[xa,ya+extent],[xb,yb+extent],[xb,yb-extent]],j%2?'#a7b59d':'#c4ccb5');ctx.strokeStyle='#6d826d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xb,yb-extent);ctx.lineTo(xb,yb+extent);ctx.stroke();}
  ctx.strokeStyle='#c5d4c4';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x-side*29,y+22-extent);ctx.quadraticCurveTo(x-side*35,y+28,x-side*29,y+26+extent);ctx.stroke();
 }
}

function stoneEdge(points){
 ctx.strokeStyle='#536d62';ctx.lineWidth=8;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x+2,y+6):ctx.moveTo(x+2,y+6));ctx.stroke();
 ctx.strokeStyle='#9daa98';ctx.lineWidth=4.5;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
 ctx.strokeStyle='#c4ccb8';ctx.lineWidth=1;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x-1,y-2):ctx.moveTo(x-1,y-2));ctx.stroke();
 for(let j=1;j<points.length;j+=3){const [x,y]=points[j];ctx.strokeStyle='rgba(45,70,60,.5)';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x,y+1);ctx.lineTo(x+3,y+7);ctx.stroke();}
}
function drawRaisedBanks(){
 for(const side of [-1,1]){
  for(let y=-30;y<MAP_H+30;y+=6){
   const y2=y+6,x1=river(y)+side*(riverWidth(y)+1),x2=river(y2)+side*(riverWidth(y2)+1),middle=(x1+x2)*.5,ym=y+3;
   if(side<0&&periodicDistance(ym,branch(middle))<29)continue;
   const villageNear=villages.some(h=>periodicDistance(ym,h.y)<100&&h.side===side),height=16+5*Math.sin(ym*TAU*2/MAP_H+.4)+3*Math.sin(ym*TAU*5/MAP_H),inset=side*(8+height*.18);
   const toe1=[x1-inset,y+height],toe2=[x2-inset,y2+height],shade=ctx.createLinearGradient(middle,ym,middle-inset,ym+height);
   shade.addColorStop(0,villageNear?'#929c91':'#737e6c');shade.addColorStop(.35,villageNear?'#6e7a73':'#5b695c');shade.addColorStop(1,'#2d4140');
   polygon(ctx,[[x1,y],[x2,y2],toe2,toe1],shade);
   ctx.strokeStyle='#1e3336';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...toe1);ctx.lineTo(...toe2);ctx.stroke();
   ctx.strokeStyle=villageNear?'#d1d1bd':'#a7b194';ctx.lineWidth=villageNear?4:2.4;ctx.beginPath();ctx.moveTo(x1+side,y);ctx.lineTo(x2+side,y2);ctx.stroke();
   if(villageNear&&Math.round(y/6)%2===0){ctx.strokeStyle='rgba(26,42,42,.7)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x1-side,ym);ctx.lineTo(x1-inset*.75,ym+height*.75);ctx.stroke();}
  }
 }
 // Curving lanes join the irregular clusters; only the village waterfront is paved.
 for(const h of villages){const bank=river(h.y)+h.side*(riverWidth(h.y)+17);ctx.strokeStyle='#a8b09a';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(h.x,h.y+8);ctx.quadraticCurveTo((h.x+bank)*.5,h.y+18,bank,h.y+7);ctx.stroke();ctx.strokeStyle='#c2c7b0';ctx.lineWidth=1;ctx.stroke();
  if(h.style==='tea-shop'||h.style==='gatehouse'){const x=river(h.y)+h.side*(riverWidth(h.y)-5);for(let j=0;j<5;j++){ctx.fillStyle=j%2?'#a3b09c':'#bfc8b1';ctx.fillRect(x+h.side*j*3-5,h.y+12+j,10,2);}}
 }

 drawWaterfrontStairs();
}

const smokeSprite=(()=>{const c=canvas(48,48),g=c.getContext('2d'),v=g.createRadialGradient(24,24,2,24,24,22);v.addColorStop(0,'rgba(218,226,212,.65)');v.addColorStop(1,'rgba(218,226,212,0)');g.fillStyle=v;g.fillRect(0,0,48,48);return c;})();
const mistSprite=(()=>{const c=canvas(900,240),g=c.getContext('2d'),r=rng(711);for(let j=0;j<17;j++){const x=80+r()*740,y=90+r()*60;g.save();g.translate(x,y);g.scale(3.3,1);const v=g.createRadialGradient(0,0,0,0,0,36+r()*22);v.addColorStop(0,'rgba(220,227,214,.18)');v.addColorStop(1,'rgba(220,227,214,0)');g.fillStyle=v;g.fillRect(-70,-70,140,140);g.restore();}return c;})();
function drawVillageSmoke(){
 for(const h of villages){if(!['tea-shop','shophouse'].includes(h.style))continue;eachVisibleCopy(h,150,y=>{for(let j=0;j<3;j++){const p=fract(t/24+h.seed+j/3),s=12+p*28;ctx.globalAlpha=Math.sin(p*Math.PI)*.25;ctx.drawImage(smokeSprite,h.x+p*13-s*.5,y-h.size*.65-p*40-s*.5,s,s);}});}ctx.globalAlpha=1;
}
function drawValleyMist(){for(const band of [{x:290,y:535,w:770},{x:750,y:230,w:640},{x:490,y:1100,w:820}])eachVisibleCopy(band,160,y=>{ctx.globalAlpha=.40;ctx.drawImage(mistSprite,band.x-band.w*.5,y-90,band.w,190);});ctx.globalAlpha=1;}

let visibleProps=[],visibleAnimals=[],lastInfo=-1,collectionKey='',staticBakes=0;
const terrainAtlas=canvas(N,MAP_H),groundAtlas=canvas(N,MAP_H);
function collect(){
 if(collectionKey==='fixed')return;collectionKey='fixed';visibleProps=[];visibleAnimals=[];
 for(let i=0;i<3;i++){const c=getChunk(i);visibleProps.push(...c.props);visibleAnimals.push(...c.animals);}
}

function bakeLandscape(){
 const terrainContext=terrainAtlas.getContext('2d');terrainContext.imageSmoothingEnabled=false;
 for(let y=0;y<MAP_H;y+=N){gl.uniform1f(cameraLoc,y);gl.uniform1f(clockLoc,0);gl.drawArrays(gl.TRIANGLES,0,6);terrainContext.drawImage(terrainGenerator,0,y,N,N);}
 const liveContext=ctx;ctx=groundAtlas.getContext('2d');ctx.clearRect(0,0,N,MAP_H);ctx.imageSmoothingEnabled=true;
 drawRaisedBanks();
 for(const offset of [-MAP_H,0,MAP_H]){
  for(const o of visibleProps){if(['grass','flower','reed','lily'].includes(o.type))drawGroundProp(o,o.y+offset);}
  for(const o of visibleProps){if(o.type==='tree'||o.type==='bush')drawVegetationShadow(o,o.y+offset);}
 }
 ctx=liveContext;staticBakes++;
}
function drawScrollingBackground(){
 const contexts=[land.getContext('2d'),ground.getContext('2d')],sources=[terrainAtlas,groundAtlas];
 const top=((camera.y%MAP_H)+MAP_H)%MAP_H;
 for(let i=0;i<2;i++){const g=contexts[i];g.imageSmoothingEnabled=false;g.clearRect(0,0,N,N);g.drawImage(sources[i],0,-top);if(top+N>MAP_H)g.drawImage(sources[i],0,MAP_H-top);}
}
function eachVisibleCopy(o,margin,callback){
 const first=Math.floor((camera.y-o.y-margin)/MAP_H),last=Math.ceil((camera.y+N-o.y+margin)/MAP_H);
 for(let k=first;k<=last;k++){const y=o.y+k*MAP_H-camera.y;if(y>-margin&&y<N+margin)callback(y,k*MAP_H);}
}
const waterWaves=Array.from({length:75},(_,i)=>{const r=rng(i*51+722),y=r()*MAP_H,x=river(y)+(r()-.5)*riverWidth(y)*1.6;return {x,y,phase:r(),cycles:4+i%3,size:5+r()*12};});
function drawWaterMotion(){
 ctx.strokeStyle='#c4d0c8';ctx.lineWidth=.75;
 for(const wave of waterWaves){const p=fract(t/LOOP*wave.cycles+wave.phase),yy=wave.y+(p-.5)*42;if(coastField(wave.x,yy)>-7)continue;eachVisibleCopy({y:yy},15,y=>{ctx.globalAlpha=Math.sin(p*Math.PI)**2*.30;ctx.beginPath();ctx.moveTo(wave.x-wave.size,y);ctx.quadraticCurveTo(wave.x,y+1,wave.x+wave.size,y);ctx.stroke();});}
 ctx.globalAlpha=1;
}

function draw(){
 const drawStarted=performance.now();drawScrollingBackground();
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,N,N);ctx.imageSmoothingEnabled=true;drawWaterMotion();
 const ordered=[];
 for(const o of visibleProps)if(['tree','bush','rock','house','ridge'].includes(o.type))eachVisibleCopy(o,o.style==='pagoda'?440:220,y=>ordered.push({o,y}));
 for(const o of visibleAnimals)eachVisibleCopy(o,65,y=>ordered.push({o,y}));
 for(const p of pedestrians){updatePedestrian(p);if(p.route!=='bridge')eachVisibleCopy(p,35,y=>ordered.push({o:p,y}));}
 ordered.sort((a,b)=>a.y-b.y);
 for(const {o,y} of ordered){if(o.type==='tree'||o.type==='bush')drawVegetation(o,y);else if(o.type==='house')drawHouse(o,y);else if(o.type==='ridge')drawRidge(o,y);else if(o.type==='rock')drawRock(o,y);else if(o.type==='person')drawPerson(o,y);else drawAnimal(o,y);}
 for(const [i,bridge] of bridgeSites.entries())eachVisibleCopy(bridge,180,y=>{drawBridge(bridge,y);for(const p of pedestrians)if(p.route==='bridge'&&p.bridge===i)drawPerson(p,y+p.y-bridge.y);drawBridgeFrontRail(bridge,y);});
 drawVillageSmoke();drawValleyMist();
 if(Math.floor(t*4)!==lastInfo){lastInfo=Math.floor(t*4);const guide=visibleAnimals.find(a=>a.lead);$('picture').dataset.voyage=JSON.stringify({time:+t.toFixed(2),cameraY:+camera.y.toFixed(2),guideX:+guide.x.toFixed(2),guideY:+guide.y.toFixed(2),screenY:+(guide.y-camera.y).toFixed(2),boats:visibleAnimals.filter(a=>a.type==='boat').length,aircraft:false,pagodas:villages.filter(h=>h.style==='pagoda').length,stiltHouses:villages.filter(h=>h.stilt).length,pedestrians:pedestrians.length});}
 const drawMs=performance.now()-drawStarted;perf.drawMs+=drawMs;perf.maxDrawMs=Math.max(perf.maxDrawMs,drawMs);
}

function resize(){const terrainSize=896;terrainGenerator.width=terrainGenerator.height=terrainSize;land.width=land.height=N;ground.width=ground.height=N;life.width=life.height=N;gl.viewport(0,0,terrainSize,terrainSize);dirty=true;}
resize();
function pauseUI(){const b=$('pause');b.querySelector('span').textContent=paused?'继续':'暂停';b.setAttribute('aria-label',paused?'继续游览':'暂停游览');b.querySelector('path').setAttribute('d',paused?'M4 2l9 6-9 6z':'M5 3v10M11 3v10');}
function reset(){t=0;updateFlight(0);for(const a of visibleAnimals)updateAnimal(a,0);lastInfo=-1;dirty=true;draw();}
$('pause').onclick=()=>{paused=!paused;pauseUI();};
$('speed').onclick=()=>{speed=speed===1?1.6:speed===1.6?.65:1;$('speed').textContent=speed+'× 播速';};
$('restart').onclick=reset;
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('picture').requestFullscreen();}catch{$('full').setAttribute('aria-label','浏览器暂不支持全屏');}};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();paused=!paused;pauseUI();}});
document.addEventListener('visibilitychange',()=>{last=0;});
terrainGenerator.addEventListener('webglcontextlost',e=>{e.preventDefault();});
function loop(ms){const rawMs=last?ms-last:0,dt=Math.min(rawMs/1000,.045);last=ms;
 if(document.hidden){requestAnimationFrame(loop);return;}
 if(!paused){t=(t+dt*speed)%(LOOP*5);updateFlight(dt);for(const a of visibleAnimals)updateAnimal(a,dt);draw();dirty=false;}else if(dirty){draw();dirty=false;}
 if(!paused&&!document.hidden&&rawMs>0){perf.frames++;perf.elapsed+=rawMs;if(perf.elapsed>=2000){$('picture').dataset.performance=JSON.stringify({fps:+(perf.frames*1000/perf.elapsed).toFixed(1),avgDrawMs:+(perf.drawMs/perf.frames).toFixed(2),maxDrawMs:+perf.maxDrawMs.toFixed(2),terrainPixels:land.width*land.height,staticBakes});perf.frames=0;perf.elapsed=0;perf.drawMs=0;perf.maxDrawMs=0;}}
 requestAnimationFrame(loop);
}
const reviewFrame=new URLSearchParams(location.search).get('frame');
if(reviewFrame!==null&&(location.hostname==='127.0.0.1'||location.hostname==='localhost'||location.protocol==='file:')){t=clamp(Number(reviewFrame)||0,0,LOOP*5);paused=true;$('loading').style.transition='none';}
collect();updateFlight(0);for(const a of visibleAnimals)updateAnimal(a,0);bakeLandscape();pauseUI();draw();$('loading').classList.add('done');requestAnimationFrame(loop);
})();
</script>
</body></html>
