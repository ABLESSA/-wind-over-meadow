 visibleProps=[];visibleAnimals=[];
 for(let i=0;i<3;i++){const c=getChunk(i);visibleProps.push(...c.props.filter(o=>o.type!=='cloud'&&o.y<MAP_H));visibleAnimals.push(...c.animals.filter(a=>a.homeY>25&&a.homeY<MAP_H-25));}
 const addCloud=(x,y,ratio,thickness,seed)=>{const template=clouds[Math.floor(seed)%6];visibleProps.push({type:'cloud',x,y,size:ratio*68*template.w/(2*template.boundsWidth),seed,ratio,thickness});};
 addCloud(860,30,12,0,203);addCloud(515,380,4.7,2,119);
 addCloud(105,735,2.6,3,357);addCloud(900,865,7.8,1,482);
}
function bakeLandscape(){
 const terrainContext=terrainAtlas.getContext('2d');terrainContext.imageSmoothingEnabled=false;
 for(let y=0;y<MAP_H;y+=N){gl.uniform1f(cameraLoc,y);gl.uniform1f(clockLoc,0);gl.drawArrays(gl.TRIANGLES,0,6);terrainContext.drawImage(terrainGenerator,0,y,N,N);}
 const liveContext=ctx;ctx=groundAtlas.getContext('2d');ctx.clearRect(0,0,N,MAP_H);ctx.imageSmoothingEnabled=false;
 drawRaisedBanks();
 for(const offset of [-MAP_H,0,MAP_H]){
  for(const o of visibleProps){if(['grass','flower','reed','lily'].includes(o.type))drawGroundProp(o,o.y+offset);}
  for(const o of visibleProps){if(o.type==='tree'||o.type==='bush')drawVegetationShadow(o,o.y+offset);}
 }
 ctx=liveContext;staticBakes++;
}
function drawScrollingBackground(){
 const contexts=[land.getContext('2d'),ground.getContext('2d')],sources=[terrainAtlas,groundAtlas];
 const top=((camera.y%MAP_H)+MAP_H)%MAP_H;
 for(let i=0;i<2;i++){const g=contexts[i];g.imageSmoothingEnabled=false;g.clearRect(0,0,N,N);g.drawImage(sources[i],0,-top);if(top+N>MAP_H)g.drawImage(sources[i],0,MAP_H-top);}
}
function eachVisibleCopy(o,margin,callback){
 const first=Math.floor((camera.y-o.y-margin)/MAP_H),last=Math.ceil((camera.y+N-o.y+margin)/MAP_H);
 for(let k=first;k<=last;k++){const y=o.y+k*MAP_H-camera.y;if(y>-margin&&y<N+margin)callback(y,k*MAP_H);}
}
const waterWaves=Array.from({length:56},(_,i)=>{const r=rng(i*93+501);return {y:r()*MAP_H,side:(r()-.5)*1.50,phase:r(),size:4+r()*6,cycles:i%3+1};});
function drawWaterMotion(){
 ctx.lineWidth=1.3;ctx.strokeStyle='#e1ead7';
 for(const wave of waterWaves){const p=fract(t/LOOP*wave.cycles+wave.phase),worldY=wave.y+(p-.5)*23,x=river(worldY)+wave.side*riverWidth(worldY),alpha=Math.sin(p*Math.PI)**2*.48;
  eachVisibleCopy({y:worldY},12,y=>{ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(x-wave.size,y);ctx.lineTo(x-wave.size*.45,y+2);ctx.lineTo(x+wave.size*.5,y+2);ctx.lineTo(x+wave.size,y);ctx.stroke();});
 }
 ctx.globalAlpha=1;
}
function draw(){
 const drawStarted=performance.now();
 drawScrollingBackground();
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,N,N);ctx.imageSmoothingEnabled=false;
 drawWaterMotion();
 const ordered=[],cloudViews=[];
 for(const o of visibleProps){
  if(o.type==='cloud')eachVisibleCopy(o,o.size*.85+25,(_y,offset)=>cloudViews.push(cloudView(o,offset)));
  else if(['tree','bush','rock'].includes(o.type))eachVisibleCopy(o,190,y=>ordered.push({o,y}));
 }
 for(const o of visibleAnimals)eachVisibleCopy(o,40,y=>ordered.push({o,y}));
 ordered.sort((a,b)=>a.y-b.y);
 for(const entry of ordered){const {o,y}=entry;if(o.type==='tree'||o.type==='bush')drawVegetation(o,y);else if(o.type==='rock')drawRock(o,y);else drawAnimal(o,y);}
 const py=flight.y-camera.y;
 let transmittance=1,sunTransmission=1;
 for(const view of cloudViews){const center=cloudDensity(view,flight.x,py),nose=cloudDensity(view,flight.x+Math.sin(flight.heading)*25,py-Math.cos(flight.heading)*25),wings=(cloudDensity(view,flight.x-25,py)+cloudDensity(view,flight.x+25,py))*.5;transmittance*=1-(center*.5+nose*.2+wings*.3);
  const heightFactor=.65+(1-flight.altitude)*.15;sunTransmission*=1-cloudDensity(view,flight.x-(68+view.s*.11)*heightFactor,py-(85+view.s*.07)*heightFactor)*.9;
 }
 const cover=1-transmittance,lightShade=1-sunTransmission;
 drawPlane(flight.x+9+flight.altitude*20,py+10+flight.altitude*24,true,cover,lightShade);
 for(const view of cloudViews){cloudShadow(view);drawCloud(view,true);}
 drawPlane(flight.x,py,false,cover,lightShade);
 for(const view of cloudViews)drawCloud(view,false);
 if(Math.floor(t*2)!==lastInfo){lastInfo=Math.floor(t*2);
  // Read-only diagnostics support checking real trajectories and animal movement in a desktop preview.
  $('picture').dataset.flight=JSON.stringify({time:+t.toFixed(3),x:+flight.x.toFixed(3),y:+flight.y.toFixed(3),heading:+flight.heading.toFixed(5),vx:+flight.vx.toFixed(4),vy:+flight.vy.toFixed(4),bank:+flight.bank.toFixed(5),cameraY:+camera.y.toFixed(3),cloudCoverage:+cover.toFixed(3),airspeed:+(flight.airspeed*speed).toFixed(3),dive:+flight.dive.toFixed(3),altitude:+flight.altitude.toFixed(3)});
  $('picture').dataset.clouds=JSON.stringify(cloudViews.map(v=>({width:+(v.ratio*68).toFixed(1),planeRatio:+v.ratio.toFixed(2),thickness:v.thickness,shadowStrength:v.sprite.shadowStrength})));
  $('picture').dataset.animals=JSON.stringify(visibleAnimals.filter(a=>a.y-camera.y>0&&a.y-camera.y<1000).map(a=>({id:Math.floor(a.seed*1e6),type:a.type,x:+a.x.toFixed(2),y:+a.y.toFixed(2),mode:a.mode,heading:+a.heading.toFixed(3)})));
  $('picture').dataset.loop=JSON.stringify({seconds:LOOP,elapsed:+t.toFixed(2),staticBakes,cameraY:+camera.y.toFixed(2)});
 }
 const drawMs=performance.now()-drawStarted;perf.drawMs+=drawMs;perf.maxDrawMs=Math.max(perf.maxDrawMs,drawMs);
}
function resize(){const terrainSize=672;terrainGenerator.width=terrainGenerator.height=terrainSize;land.width=land.height=N;ground.width=ground.height=N;life.width=life.height=N;gl.viewport(0,0,terrainSize,terrainSize);dirty=true;}
resize();
function pauseUI(){const b=$('pause');b.querySelector('span').textContent=paused?'继续':'暂停';b.setAttribute('aria-label',paused?'继续飞行':'暂停飞行');b.querySelector('path').setAttribute('d',paused?'M4 2l9 6-9 6z':'M5 3v10M11 3v10');}
function reset(){t=0;updateFlight(0);for(const a of visibleAnimals)updateAnimal(a,0);lastInfo=-1;dirty=true;draw();}
$('pause').onclick=()=>{paused=!paused;pauseUI();};
$('speed').onclick=()=>{speed=speed===1?1.6:speed===1.6?.65:1;$('speed').textContent=speed+'× 播速';};
$('restart').onclick=reset;
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('picture').requestFullscreen();}catch{$('full').setAttribute('aria-label','浏览器暂不支持全屏');}};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();paused=!paused;pauseUI();}});
document.addEventListener('visibilitychange',()=>{last=0;});
terrainGenerator.addEventListener('webglcontextlost',e=>{e.preventDefault();});
function loop(ms){const rawMs=last?ms-last:0,dt=Math.min(rawMs/1000,.045);last=ms;
 if(document.hidden){requestAnimationFrame(loop);return;}
 if(!paused){t=(t+dt*speed)%LOOP;updateFlight(dt);for(const a of visibleAnimals)updateAnimal(a,dt);draw();dirty=false;}else if(dirty){draw();dirty=false;}
 if(!paused&&!document.hidden&&rawMs>0){perf.frames++;perf.elapsed+=rawMs;if(perf.elapsed>=2000){$('picture').dataset.performance=JSON.stringify({fps:+(perf.frames*1000/perf.elapsed).toFixed(1),avgDrawMs:+(perf.drawMs/perf.frames).toFixed(2),maxDrawMs:+perf.maxDrawMs.toFixed(2),terrainPixels:land.width*land.height,staticBakes});perf.frames=0;perf.elapsed=0;perf.drawMs=0;perf.maxDrawMs=0;}}
 requestAnimationFrame(loop);
}
collect();updateFlight(0);for(const a of visibleAnimals)updateAnimal(a,0);bakeLandscape();pauseUI();draw();$('loading').classList.add('done');requestAnimationFrame(loop);
})();
</script>
